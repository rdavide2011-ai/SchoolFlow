name: SchoolFlow Android Capacitor AAB

on:
  push:
    paths:
      - 'index.html'
      - 'SchoolFlow-logo.png'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/build-android.yml'
      - 'android-widgets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Create Capacitor 7 project from approved web sources
        shell: bash
        run: |
          mkdir -p www
          cp index.html SchoolFlow-logo.png manifest.webmanifest sw.js www/
          cat > package.json <<'EOF'
          {
            "name": "schoolflow-android",
            "version": "1.3.2",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3",
              "@capacitor/haptics": "7.0.5",
              "@capacitor/preferences": "7.0.4"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rivapps.schoolflow",
            "appName": "SchoolFlow",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost"
            }
          }
          EOF
          npm install --no-fund --no-audit
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import re, shutil
          from pathlib import Path
          path=Path("android/app/build.gradle")
          old=path.read_text()
          new,n=re.subn(r'\bversionCode\s+\d+', 'versionCode 16', old, count=1)
          if n!=1: raise SystemExit("Could not assign Android versionCode")
          new,n=re.subn(r'\bversionName\s+["\x27][^"\x27]+["\x27]', 'versionName "1.3.2"', new, count=1)
          if n!=1: raise SystemExit("Could not assign Android versionName")
          path.write_text(new)
          # Capacitor 7 defaults to minSdkVersion 23. Google Play's automatic
          # protection requires 24 or higher, so update Gradle's source value.
          variables=Path("android/variables.gradle")
          variables_before=variables.read_text()
          variables_after,min_n=re.subn(r'(?m)^(\s*minSdkVersion\s*=\s*)\d+', r'\g<1>24', variables_before, count=1)
          if min_n!=1: raise SystemExit("Could not assign Android minSdkVersion in variables.gradle")
          variables.write_text(variables_after)
          # Google Play requires targeting Android API 36 for this app.
          sdk_variables=variables.read_text()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              sdk_variables,count=re.subn(r'(?m)^(\s*'+key+r'\s*=\s*)\d+', r'\g<1>36', sdk_variables, count=1)
              if count!=1: raise SystemExit("Could not set "+key+" to 36")
          variables.write_text(sdk_variables)
          # Keep the original SchoolFlow logo as the launcher icon.
          res=Path("android/app/src/main/res")
          source=Path("SchoolFlow-logo.png")
          for icon in res.rglob("ic_launcher*.png"):
              shutil.copyfile(source,icon)
          drawable=res/"drawable-nodpi"
          drawable.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source,drawable/"schoolflow_logo.png")
          for icon in res.rglob("mipmap-anydpi-v26/ic_launcher*.xml"):
              icon.write_text(icon.read_text().replace("@drawable/ic_launcher_foreground","@drawable/schoolflow_logo"))
          PY
          python3 android-widgets/setup_widgets.py android
      - name: Verify approved SchoolFlow features and identical bundled source
        shell: bash
        run: |
          cmp index.html www/index.html
          cmp index.html android/app/src/main/assets/public/index.html
          grep -q "PreferencesPlugin" android/app/src/main/assets/capacitor.plugins.json
          grep -q "HapticsPlugin" android/app/src/main/assets/capacitor.plugins.json
          test -f android/app/src/main/java/com/rivapps/schoolflow/SchoolFlowWidgetsPlugin.java
          grep -q "registerPlugin(SchoolFlowWidgetsPlugin.class)" android/app/src/main/java/com/rivapps/schoolflow/MainActivity.java
          grep -q "OverallWidgetProvider" android/app/src/main/AndroidManifest.xml
          grep -q "SubjectsWidgetProvider" android/app/src/main/AndroidManifest.xml
          grep -q "LastWidgetProvider" android/app/src/main/AndroidManifest.xml
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const tests={
            homeFilters:['setHomeSubjectFilter','homeSubjectSort','homeSubjectCount'],
            gradeFilters:['setGradeFilter','gradeSort','gradeCount'],
            graphModes:['chartModeSelect','setSfChart','function multiChart'],
            subjects:['subject-manage-actions','subject-manage-average'],
            undoGrade:['undoGradeDelete','gradeUndoLabel','deleteGradeFromDetail'],
            undoSubject:['undoSubjectDelete','subjectUndoLabel'],
            backup:['function exportBackup','function importBackup'],
            preservedStorage:['schoolflow_mobile_v2','_storageRevision','SHADOW_KEY','NATIVE_KEY','recoverStorageBeforeStart'],
            safeSaving:['storageProblem','queueNativeSave','archiveCurrentPeriod(persist=true)'],
            animationSave:['sfConfirm','sfRun','Haptics'],
            hapticSettings:['setHapticLevel','playHapticPreview','hapticSection'],
            widgets:['pushWidgetsSoon','addWidget','widgetSection','SchoolFlowWidgets'],
            pagella:['openPagella','sharePagella','pagellaCanvas'],
            animazioni:['animateAvg','sfIn','sfSheetOut'],
            tutorial:['startTour','askTutorial','tutAnswer'],
            sharing:['shareApp','storyCanvas','PLAY_URL','isNativeApp','tapHaptic']
          };
          for(const [feature,markers] of Object.entries(tests)){
            for(const marker of markers){
              if(!html.includes(marker))throw Error(feature+': missing '+marker);
            }
            console.log('OK '+feature);
          }
          for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            new Function(m[1]);
          }
          console.log('OK JavaScript syntax');
          NODE
          grep -q '"appId": "com.rivapps.schoolflow"' capacitor.config.json
          grep -q '"androidScheme": "https"' capacitor.config.json
          grep -q '"hostname": "localhost"' capacitor.config.json
          grep -q 'versionCode 16' android/app/build.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Build Android AAB and debug APK
        run: cd android && ./gradlew --no-daemon :app:bundleRelease :app:assembleDebug
      - name: Sign only when the Play-approved upload key is configured
        env:
          SF_KEYSTORE_B64: ${{ secrets.SCHOOLFLOW_UPLOAD_KEYSTORE_BASE64 }}
          SF_KEYSTORE_PASSWORD: ${{ secrets.SCHOOLFLOW_UPLOAD_KEYSTORE_PASSWORD }}
          SF_KEY_ALIAS: ${{ secrets.SCHOOLFLOW_UPLOAD_KEY_ALIAS }}
          SF_KEY_PASSWORD: ${{ secrets.SCHOOLFLOW_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [[ -n "$SF_KEYSTORE_B64" && -n "$SF_KEYSTORE_PASSWORD" && -n "$SF_KEY_ALIAS" && -n "$SF_KEY_PASSWORD" ]]; then
            echo "$SF_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/schoolflow-upload.jks"
            jarsigner -keystore "$RUNNER_TEMP/schoolflow-upload.jks" -storepass:env SF_KEYSTORE_PASSWORD -keypass:env SF_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$SF_KEY_ALIAS"
            jarsigner -verify "$AAB"
            rm -f "$RUNNER_TEMP/schoolflow-upload.jks"
            echo "Signed with provided Play upload key" > android/aab-signing-status.txt
          else
            echo "UNSIGNED: Play upload signing key was not configured" > android/aab-signing-status.txt
          fi
      - name: Verify Android bundle, package, and embedded web app
        shell: bash
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$AAB" | tail -n 2
          unzip -p "$AAB" base/assets/public/index.html > /tmp/schoolflow-bundle-index.html
          cmp index.html /tmp/schoolflow-bundle-index.html
          sha256sum index.html /tmp/schoolflow-bundle-index.html
          cat android/aab-signing-status.txt
          # Inspect compiled APK manifest, not just the source Gradle text.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > /tmp/schoolflow-aapt.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" /tmp/schoolflow-aapt.txt
          grep -q "name='com.rivapps.schoolflow'" /tmp/schoolflow-aapt.txt
          grep -q "versionCode='16'" /tmp/schoolflow-aapt.txt
          grep -q "android.permission.VIBRATE" /tmp/schoolflow-aapt.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > /tmp/schoolflow-manifest.txt
          grep -q "OverallWidgetProvider" /tmp/schoolflow-manifest.txt
          grep -q "SubjectsWidgetProvider" /tmp/schoolflow-manifest.txt
          grep -q "LastWidgetProvider" /tmp/schoolflow-manifest.txt
          grep -q "android.appwidget.provider" /tmp/schoolflow-manifest.txt
          grep -q "sdkVersion:'24'" /tmp/schoolflow-aapt.txt
          grep -q "targetSdkVersion:'36'" /tmp/schoolflow-aapt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolFlow-Capacitor-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            android/aab-signing-status.txt
          retention-days: 14
